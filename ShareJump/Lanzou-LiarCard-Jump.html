<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件获取</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;background:#f5f6f8;color:#1f2329;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{width:100%;max-width:420px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08);padding:32px 28px;text-align:center}
  .title{font-size:20px;font-weight:600;margin-bottom:8px}
  .desc{font-size:14px;color:#646a73;line-height:1.6;margin-bottom:24px}
  .row{margin-top:14px;padding:14px;border:1px solid #e5e6eb;border-radius:10px;text-align:left}
  .row label{display:block;font-size:12px;color:#646a73;margin-bottom:6px}
  .row .val{font-size:14px;word-break:break-all;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .row .val span{flex:1;min-width:0}
  .btn{flex:none;font-size:13px;border:1px solid #2563eb;background:#fff;color:#2563eb;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#eef3ff}
  .btn.primary{background:#2563eb;color:#fff}
  .btn.primary:hover{background:#1d4fc4}
  .hint{margin-top:20px;font-size:12px;color:#646a73;line-height:1.7}
</style>
</head>
<body>
  <div class="card">
    <div class="title">文件获取</div>
    <div class="desc">请先复制密码，再点击跳转打开分享页，粘贴密码后下载</div>

    <!-- 密码行：复制按钮 -->
    <div class="row">
      <label>提取密码</label>
      <div class="val">
        <span id="pwdText">9sik</span>
        <button class="btn" id="copyPwdBtn" type="button">复制</button>
      </div>
    </div>

    <!-- 网址行：跳转按钮 -->
    <div class="row">
      <label>分享网址</label>
      <div class="val">
        <span id="urlText">https://wwbrm.lanzouq.com/ibh5l4h7099c</span>
        <button class="btn primary" id="goUrlBtn" type="button">跳转</button>
      </div>
    </div>

    <div class="hint">密码与网址均需手动点击对应按钮后才会复制或打开，页面不会自动跳转。</div>
  </div>

<script>
/* ===================== 固化配置 ===================== */
const CONFIG = {
  pwd: "9sik",
  originUrl: "https://wwbrm.lanzouq.com/ibh5l4h7099c"
};
/* ==================================================== */

const $ = id => document.getElementById(id);

async function copyText(text){
  if(!text) return false;
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ok=document.execCommand("copy");}catch(_){}
    document.body.removeChild(ta); return ok;
  }
}

/* 复制密码：仅点击按钮后执行 */
$("copyPwdBtn").addEventListener("click", async ()=>{
  const ok = await copyText(CONFIG.pwd);
  const btn = $("copyPwdBtn");
  const old = btn.textContent;
  btn.textContent = ok ? "已复制" : "失败";
  setTimeout(()=> btn.textContent = old, 1200);
});

/* 跳转网址：仅点击按钮后执行 */
$("goUrlBtn").addEventListener("click", ()=>{
  window.open(CONFIG.originUrl, "_blank", "noopener");
});
</script>
</body>
</html>
